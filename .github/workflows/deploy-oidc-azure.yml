name: Deploy (Azure OIDC)

# Keyless deployment to Azure using OpenID Connect (Advanced Module 10 / Lab 11).
# There are NO Azure credentials stored in GitHub. At run time GitHub mints a
# short-lived OIDC token; Azure trades it for an access token via a *federated
# credential* on an app registration.
#
# Before this runs you must (see Lab 11):
#   1. Create an Entra app registration + service principal.
#   2. Add a FEDERATED CREDENTIAL whose subject matches this workflow's trigger,
#      e.g. repo:<ORG>/<REPO>:environment:production
#   3. Grant the service principal a role on the target Azure scope.
#   4. Store only NON-SECRET IDs below as variables or secrets.
on:
  workflow_dispatch:

# Deploy through an environment so the approval gate + branch limits from Lab 10
# apply here too. Defense in depth: gate (env) + keyless identity (OIDC).
jobs:
  deploy:
    name: Deploy to Azure (production)
    runs-on: ubuntu-latest
    environment:
      name: production
    # id-token: write is REQUIRED for OIDC and is NOT granted by default.
    # contents: read is the least the checkout needs. Nothing else.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # These are IDENTIFIERS, not secrets. They are safe to store as repo/env
      # *variables*; secrets are used here only to keep the template uniform.
      - name: Log in to Azure (federated, no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the keyless identity
        run: az account show --output table

      # Replace with a real deployment step for your target (Web App, Container
      # App, AKS, etc.). Kept as an echo so the template runs without infra.
      - name: Deploy
        run: echo "Deploying CivicPermit with a short-lived OIDC token — no stored cloud keys."
