<!--
  Dark-mode toggle for the Cayman theme.

  Cayman's default layout includes this file inside <head>, so with no theme
  override, no Jekyll plugin, and no Marketplace action we:
    1) apply the saved (or OS-preferred) theme immediately to avoid a flash, and
    2) inject a floating toggle button once the page has loaded.
  The choice is remembered in localStorage per browser.
-->
<style>
  /* Floating toggle button */
  #theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 1000;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.6);
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  }
  #theme-toggle:hover { background: rgba(0, 0, 0, 0.4); }
  #theme-toggle:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }

  /* ---- Dark theme overrides for Cayman ---- */
  html[data-theme="dark"] body {
    background-color: #0d1117;
    color: #c9d1d9;
  }
  html[data-theme="dark"] .main-content { color: #c9d1d9; }
  html[data-theme="dark"] .main-content h1,
  html[data-theme="dark"] .main-content h2,
  html[data-theme="dark"] .main-content h3,
  html[data-theme="dark"] .main-content h4,
  html[data-theme="dark"] .main-content h5,
  html[data-theme="dark"] .main-content h6 { color: #7ee2b8; }
  html[data-theme="dark"] .main-content a { color: #58a6ff; }
  html[data-theme="dark"] .page-header {
    background-color: #0b3a66;
    background-image: linear-gradient(120deg, #0b3a66, #0f7a5a);
  }

  /* Inline code and code blocks */
  html[data-theme="dark"] .main-content code {
    background-color: #161b22;
    color: #d6dee6;
  }
  html[data-theme="dark"] .main-content pre {
    background-color: #161b22;
    color: #d6dee6;
    border: 1px solid #30363d;
  }
  html[data-theme="dark"] .main-content pre > code {
    background-color: transparent;
    color: inherit;
  }
  html[data-theme="dark"] .main-content .highlight { background-color: #161b22; }

  /* Rouge syntax tokens (GitHub-dark-ish) for readable code blocks */
  html[data-theme="dark"] .highlight .c,
  html[data-theme="dark"] .highlight .c1,
  html[data-theme="dark"] .highlight .cm,
  html[data-theme="dark"] .highlight .cd,
  html[data-theme="dark"] .highlight .cs { color: #8b949e; font-style: italic; }
  html[data-theme="dark"] .highlight .k,
  html[data-theme="dark"] .highlight .kd,
  html[data-theme="dark"] .highlight .kn,
  html[data-theme="dark"] .highlight .kp,
  html[data-theme="dark"] .highlight .kr,
  html[data-theme="dark"] .highlight .kt,
  html[data-theme="dark"] .highlight .kc { color: #ff7b72; }
  html[data-theme="dark"] .highlight .s,
  html[data-theme="dark"] .highlight .s1,
  html[data-theme="dark"] .highlight .s2,
  html[data-theme="dark"] .highlight .sb,
  html[data-theme="dark"] .highlight .sc,
  html[data-theme="dark"] .highlight .sd,
  html[data-theme="dark"] .highlight .se,
  html[data-theme="dark"] .highlight .sh,
  html[data-theme="dark"] .highlight .si,
  html[data-theme="dark"] .highlight .sx,
  html[data-theme="dark"] .highlight .dl { color: #a5d6ff; }
  html[data-theme="dark"] .highlight .m,
  html[data-theme="dark"] .highlight .mi,
  html[data-theme="dark"] .highlight .mf,
  html[data-theme="dark"] .highlight .mh,
  html[data-theme="dark"] .highlight .il { color: #79c0ff; }
  html[data-theme="dark"] .highlight .nf,
  html[data-theme="dark"] .highlight .na { color: #d2a8ff; }
  html[data-theme="dark"] .highlight .nt { color: #7ee787; }
  html[data-theme="dark"] .highlight .nv,
  html[data-theme="dark"] .highlight .vg,
  html[data-theme="dark"] .highlight .vi { color: #ffa657; }

  /* Quotes, tables, rules, footer, buttons */
  html[data-theme="dark"] .main-content blockquote {
    color: #9aa7b1;
    border-left-color: #30363d;
  }
  html[data-theme="dark"] .main-content table th,
  html[data-theme="dark"] .main-content table td { border-color: #30363d; }
  html[data-theme="dark"] .main-content table tr {
    background-color: #0d1117;
    border-top-color: #30363d;
  }
  html[data-theme="dark"] .main-content table tr:nth-child(2n) { background-color: #161b22; }
  html[data-theme="dark"] .main-content hr { background-color: #30363d; }
  html[data-theme="dark"] .site-footer {
    color: #8b949e;
    border-top-color: #30363d;
  }
  html[data-theme="dark"] .site-footer-owner a,
  html[data-theme="dark"] .site-footer-credits a { color: #58a6ff; }
  html[data-theme="dark"] .btn {
    color: #c9d1d9;
    border-color: rgba(201, 209, 217, 0.3);
  }
  html[data-theme="dark"] .btn:hover {
    background-color: rgba(201, 209, 217, 0.15);
    border-color: rgba(201, 209, 217, 0.6);
  }
</style>

<script>
  (function () {
    // 1) Apply the theme as early as possible to avoid a flash of the wrong colors.
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) {}
    var prefersDark = window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));

    // 2) Once the DOM is ready, add the floating toggle button.
    function addToggle() {
      if (document.getElementById('theme-toggle')) return;
      var btn = document.createElement('button');
      btn.id = 'theme-toggle';
      btn.type = 'button';

      function render() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.textContent = dark ? '\u2600\uFE0F' : '\uD83C\uDF19';
        var label = dark ? 'Switch to light theme' : 'Switch to dark theme';
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
      }

      btn.addEventListener('click', function () {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var next = dark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        render();
      });

      render();
      document.body.appendChild(btn);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', addToggle);
    } else {
      addToggle();
    }
  })();
</script>

<!--
  Bash / PowerShell shell selector for the Cayman theme.

  Attendees run either Bash (macOS/Linux/WSL/Git Bash) or PowerShell (Windows).
  Where a command differs between shells, the labs place a ```bash fence
  immediately followed by a ```powershell fence. On the published Pages site the
  script below detects each such adjacent pair and renders it as a single tabbed
  widget with a "Bash | PowerShell" toggle; the choice is remembered and synced
  across every widget on the page. No Jekyll plugin, no theme override, no
  Marketplace action. On github.com (which strips <style>/<script>) the two
  fences simply render stacked, so nothing is lost.
-->
<style>
  .shell-tabs { margin: 0 0 1rem; }
  .shell-tabs__nav { display: flex; gap: 0.25rem; }
  .shell-tabs__btn {
    font: inherit;
    font-size: 0.8rem;
    line-height: 1.4;
    padding: 0.3rem 0.85rem;
    cursor: pointer;
    border: 1px solid #d0d7de;
    border-bottom: none;
    background: #f6f8fa;
    color: #57606a;
    border-radius: 6px 6px 0 0;
  }
  .shell-tabs__btn[aria-selected="true"] {
    background: #fff;
    color: #0969da;
    font-weight: 600;
  }
  .shell-tabs__btn:focus-visible { outline: 2px solid #0969da; outline-offset: -2px; }
  .shell-tabs__panes { border-top: 1px solid #d0d7de; }
  .shell-tabs__pane { display: none; }
  .shell-tabs__pane.is-active { display: block; }
  .shell-tabs__pane > .highlighter-rouge { margin-top: 0.5rem; }

  /* Dark-mode parity with the toggle above */
  html[data-theme="dark"] .shell-tabs__btn {
    background: #161b22;
    color: #8b949e;
    border-color: #30363d;
  }
  html[data-theme="dark"] .shell-tabs__btn[aria-selected="true"] {
    background: #0d1117;
    color: #58a6ff;
  }
  html[data-theme="dark"] .shell-tabs__panes { border-top-color: #30363d; }
</style>

<script>
  (function () {
    var BASH = { bash: 1, sh: 1, shell: 1, console: 1, 'shell-session': 1, terminal: 1 };
    var PS = { powershell: 1, pwsh: 1, ps1: 1, posh: 1 };
    var LABEL = { bash: 'Bash', powershell: 'PowerShell' };

    function kindOf(el) {
      if (!el || el.nodeType !== 1 || !el.classList || !el.classList.contains('highlighter-rouge')) return null;
      var cls = el.className.split(/\s+/);
      for (var i = 0; i < cls.length; i++) {
        var m = /^language-(.+)$/.exec(cls[i]);
        if (m) {
          var l = m[1].toLowerCase();
          if (BASH[l]) return 'bash';
          if (PS[l]) return 'powershell';
        }
      }
      return null;
    }

    function whitespaceBetween(a, b) {
      var n = a.nextSibling;
      while (n && n !== b) {
        if (n.nodeType === 1) return false;
        if (n.nodeType === 3 && n.textContent.trim() !== '') return false;
        n = n.nextSibling;
      }
      return true;
    }

    function applyPref(pref) {
      var groups = document.querySelectorAll('.shell-tabs');
      for (var i = 0; i < groups.length; i++) {
        var btns = groups[i].querySelectorAll('.shell-tabs__btn');
        var panes = groups[i].querySelectorAll('.shell-tabs__pane');
        var idx = -1;
        for (var j = 0; j < btns.length; j++) {
          if (btns[j].getAttribute('data-shell') === pref) { idx = j; break; }
        }
        if (idx === -1) continue; // group lacks that shell — leave its current tab
        for (var k = 0; k < btns.length; k++) {
          var on = (k === idx);
          btns[k].setAttribute('aria-selected', on ? 'true' : 'false');
          btns[k].tabIndex = on ? 0 : -1;
          panes[k].classList.toggle('is-active', on);
        }
      }
    }

    function makeTabs(run) {
      var order = ['bash', 'powershell'];
      var chosen = [];
      order.forEach(function (kind) {
        for (var i = 0; i < run.length; i++) {
          if (run[i].kind === kind) { chosen.push(run[i]); break; }
        }
      });
      if (chosen.length < 2) return;

      var wrap = document.createElement('div');
      wrap.className = 'shell-tabs';
      var nav = document.createElement('div');
      nav.className = 'shell-tabs__nav';
      nav.setAttribute('role', 'tablist');
      var panes = document.createElement('div');
      panes.className = 'shell-tabs__panes';

      chosen[0].el.parentNode.insertBefore(wrap, chosen[0].el);

      chosen.forEach(function (c, i) {
        var uid = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
        var tabId = 'shell-tab-' + c.kind + '-' + uid;
        var panelId = 'shell-panel-' + c.kind + '-' + uid;

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'shell-tabs__btn';
        btn.id = tabId;
        btn.setAttribute('role', 'tab');
        btn.setAttribute('data-shell', c.kind);
        btn.setAttribute('aria-controls', panelId);
        btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
        btn.tabIndex = i === 0 ? 0 : -1;
        btn.textContent = LABEL[c.kind];
        btn.addEventListener('click', function () {
          try { localStorage.setItem('shellPref', c.kind); } catch (e) {}
          applyPref(c.kind);
        });
        nav.appendChild(btn);

        var pane = document.createElement('div');
        pane.className = 'shell-tabs__pane' + (i === 0 ? ' is-active' : '');
        pane.id = panelId;
        pane.setAttribute('role', 'tabpanel');
        pane.setAttribute('aria-labelledby', tabId);
        pane.appendChild(c.el);
        panes.appendChild(pane);
      });

      // Drop any extra same-kind blocks in the run to avoid duplicates.
      run.forEach(function (r) {
        if (chosen.indexOf(r) === -1 && r.el.parentNode) r.el.parentNode.removeChild(r.el);
      });

      wrap.appendChild(nav);
      wrap.appendChild(panes);
    }

    function build() {
      var root = document.querySelector('.main-content') || document.body;
      var el = root.firstElementChild;
      while (el) {
        var next = el.nextElementSibling;
        if (kindOf(el)) {
          var run = [{ el: el, kind: kindOf(el) }];
          var cur = el, nx = el.nextElementSibling;
          while (nx && kindOf(nx) && whitespaceBetween(cur, nx)) {
            run.push({ el: nx, kind: kindOf(nx) });
            cur = nx;
            nx = nx.nextElementSibling;
          }
          next = nx;
          var kinds = {};
          run.forEach(function (r) { kinds[r.kind] = 1; });
          if (kinds.bash && kinds.powershell) makeTabs(run);
        }
        el = next;
      }
    }

    function init() {
      build();
      var pref = null;
      try { pref = localStorage.getItem('shellPref'); } catch (e) {}
      if (pref) applyPref(pref);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
